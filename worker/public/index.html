<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Readiness Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
  /* ---- Colour tokens: change these to re-theme the whole page ---- */
  :root {
    --bg: #F7F6FB;
    --surface: #FFFFFF;
    --surface-alt: #FBFAFE;
    --ink: #1C1B33;
    --ink-soft: #4A4966;
    --muted: #6B6A85;
    --line: #E1DFEC;
    --line-strong: #CBC8DC;
    --accent: #3D3FB5;          /* indigo */
    --accent-soft: #ECECFB;
    --accent-ink: #2C2E8F;
    --open: #A3410F;            /* burnt orange for gaps */
    --open-soft: #FCEFE6;
    --user-bubble: #1C1B33;
    --user-text: #F7F6FB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
  }
  button, textarea { font: inherit; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
  .brand-title { font-weight: 600; font-size: 16px; display: block; }
  .brand-sub { font-size: 13px; color: var(--muted); }
  .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 10px; cursor: pointer; font-weight: 500;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn-dark:hover { background: var(--ink-soft); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Layout */
  .body { flex: 1; display: flex; flex-wrap: wrap; }
  aside {
    flex: 1 1 300px; max-width: 100%; padding: 28px 24px; background: var(--surface-alt);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
  }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .aside-title { font-family: 'Newsreader', serif; font-size: 26px; line-height: 1.2; margin: 2px 0 0; font-weight: 500; }
  .demo-note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; }

  .dim {
    border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .dim.active { border: 1.5px solid var(--accent); }
  .dim.done { border-color: var(--line); }
  .dim-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dim-name { font-weight: 600; font-size: 16px; }
  .dim:not(.active) .dim-name { color: var(--ink-soft); }
  .dim-count { font-size: 13px; color: var(--muted); }
  .dim.active .dim-count { color: var(--accent); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s ease; }
  .topics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .topics li { display: flex; align-items: center; gap: 10px; }
  .topics li.open { color: var(--open); font-weight: 500; }
  .topics li.todo { color: var(--muted); }
  .dim:not(.active) .topics { display: none; }
  .dim-summary { font-size: 13px; color: var(--muted); }
  .dim.active .dim-summary { display: none; }

  main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
  .thread {
    flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 32px 28px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .divider { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 500;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 600px; }
  .bubble { padding: 14px 18px; white-space: pre-wrap; }
  .msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-radius: 16px 4px 16px 16px; max-width: 560px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .check-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .cp-title { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .cp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .cp-box { border-radius: 10px; padding: 12px; font-size: 14px; }
  .cp-box .mono { font-size: 12px; display: block; }
  .cp-covered { background: var(--accent-soft); } .cp-covered .mono { color: var(--accent-ink); }
  .cp-open { background: var(--open-soft); } .cp-open .mono { color: var(--open); }
  .cp-note { font-size: 14px; color: var(--ink-soft); }

  .composer { border-top: 1px solid var(--line); background: var(--surface); padding: 16px 28px 20px; }
  .composer form { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; resize: none; border-radius: 12px; border: 1px solid var(--line-strong);
    padding: 12px 14px; color: var(--ink); background: var(--surface);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .send {
    flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0; background: var(--accent);
    display: grid; place-items: center; cursor: pointer;
  }
  .send:hover { background: var(--accent-ink); }
  .send:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 13px; color: var(--open); min-height: 1.5em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 640px) {
    header, .composer { padding-left: 16px; padding-right: 16px; }
    .thread { padding: 24px 16px; }
    aside { padding: 20px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
    .cp-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 18 L9 12 L13 15 L20 6"/><circle cx="20" cy="6" r="1.5"/></svg>
      </div>
      <div>
        <span class="brand-title">AI Readiness Assessment</span>
        <span class="brand-sub" id="sessionInfo"></span>
      </div>
    </div>
    <div class="header-actions">
      <span class="mono" id="dimCounter" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn btn-dark" type="button" id="reportButton" disabled>View report</button>
    </div>
  </header>

  <div class="body">
    <aside aria-label="Assessment progress">
      <div>
        <span class="eyebrow mono">Methodology</span>
        <h2 class="aside-title" id="asideTitle">Dimensions</h2>
      </div>
      <div class="demo-note">Demo version: the questions come from the rubric, but follow-ups and scores are fixed. No language model is used yet.</div>
      <div id="dims"></div>
    </aside>

    <main>
      <div class="thread" id="thread" aria-live="polite"></div>

      <div class="composer">
        <form id="composer">
          <div class="input-row">
            <label for="reply" class="sr-only">Your answer</label>
            <textarea id="reply" rows="2" placeholder="Type your answer…" disabled></textarea>
            <button class="send" id="sendButton" type="submit" aria-label="Send answer" disabled>
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19"/><path d="M13 6 L19 12 L13 18"/></svg>
            </button>
          </div>
          <div class="status" id="status"></div>
        </form>
      </div>
    </main>
  </div>
</div>

<script>
  // The page only shows messages and progress and calls the API; the flow runs in Python.
  // outline = [{name, subdimensions: [names]}] from the API; position = index of the
  // current subdimension across all dimensions (equal to the total when finished).
  let conversationId = null;
  let outline = [];
  let position = 0;
  let shownDimension = -1;

  const thread = document.getElementById('thread');
  const ta = document.getElementById('reply');
  const sendButton = document.getElementById('sendButton');
  const statusLine = document.getElementById('status');
  const reportButton = document.getElementById('reportButton');

  const icons = {
    done: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"/></svg>',
    open: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--open)" stroke-width="2.2"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>',
    todo: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--line-strong)" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>',
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  // Index of the dimension that holds the subdimension at `pos`.
  function dimensionAt(pos) {
    let start = 0;
    for (let i = 0; i < outline.length; i++) {
      start += outline[i].subdimensions.length;
      if (pos < start) return i;
    }
    return outline.length - 1;
  }

  function renderDims() {
    const finished = position >= outline.reduce((n, d) => n + d.subdimensions.length, 0);
    const active = finished ? -1 : dimensionAt(position);
    let start = 0;
    document.getElementById('dims').innerHTML = outline.map((d, i) => {
      const states = d.subdimensions.map((_, j) =>
        start + j < position ? 'done' : (start + j === position ? 'open' : 'todo'));
      start += d.subdimensions.length;
      const done = states.filter(s => s === 'done').length;
      const pct = Math.round(done / d.subdimensions.length * 100);
      const cls = i === active ? 'active' : (pct === 100 ? 'done' : '');
      return `<section class="dim ${cls}" style="margin-bottom:12px">
        <div class="dim-head"><span class="dim-name">${i + 1} · ${esc(d.name)}</span>
        <span class="dim-count mono">${done} / ${d.subdimensions.length}${i === active ? ' scored' : ''}</span></div>
        ${i === active || done ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ''}
        <ul class="topics">${d.subdimensions.map((t, j) =>
          `<li class="${states[j]}">${icons[states[j]]}${esc(t)}${states[j] === 'open' ? ' — current' : ''}</li>`).join('')}</ul>
        <span class="dim-summary">${d.subdimensions.map(esc).join(' · ')}</span>
      </section>`;
    }).join('');
    const shown = finished ? outline.length : active + 1;
    document.getElementById('dimCounter').textContent = `Dimension ${shown} of ${outline.length}`;
  }

  // A divider whenever the conversation reaches a new dimension.
  function addDividerIfNewDimension() {
    const i = dimensionAt(position);
    if (i === shownDimension) return;
    shownDimension = i;
    const divider = document.createElement('div');
    divider.className = 'divider mono';
    divider.textContent = `DIMENSION ${i + 1} · ${outline[i].name.toUpperCase()}`;
    thread.appendChild(divider);
  }

  function scrollDown() { thread.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' }); }

  function userMsg(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = '<div class="bubble"></div>';
    msg.querySelector('.bubble').textContent = text;
    thread.appendChild(msg);
    scrollDown();
  }

  // Adds a chatbot message showing the typing dots; returns a function that fills in the text.
  function aiMsgPending() {
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = '<div class="avatar mono">AI</div><div class="stack"><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>';
    thread.appendChild(msg);
    scrollDown();
    return {
      element: msg,
      fill(text) { msg.querySelector('.bubble').textContent = text; scrollDown(); },
    };
  }

  function addCheck(msg, check) {
    const box = document.createElement('div');
    box.className = 'check-box';
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', 'Check');
    box.innerHTML = `
      <div class="cp-title">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12 L11 15 L16 9"/></svg>
        <span></span>
      </div>
      <div class="cp-grid">
        <div class="cp-box cp-covered"><span class="mono">CRITERIA COVERED</span><span data-field="covered"></span></div>
        <div class="cp-box cp-open"><span class="mono">FOLLOW-UP CRITERIA</span><span data-field="followUpCriteria"></span></div>
      </div>
      <span class="cp-note">Test mode only (TEST_MODE=1). Respondents never see this box.</span>`;
    box.querySelector('.cp-title span').textContent =
      'Check · ' + check.subdimension + ' · ' + check.message_type + ' → ' + check.action;
    box.querySelector('[data-field="covered"]').textContent = `${check.covered} of ${check.total}`;
    box.querySelector('[data-field="followUpCriteria"]').textContent =
      check.follow_up_criteria.length ? check.follow_up_criteria.join(' / ') : '—';
    msg.querySelector('.stack').appendChild(box);
    scrollDown();
  }

  function setWaiting(waiting) {
    ta.disabled = waiting;
    sendButton.disabled = waiting;
    if (!waiting) ta.focus();
  }

  async function post(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    if (!response.ok) throw new Error(response.status);
    return response.json();
  }

  function finish() {
    reportButton.disabled = false;
    statusLine.style.color = 'var(--muted)';
    statusLine.textContent = 'Opening your results…';
    setTimeout(openReport, 1500);
  }
  function openReport() { location.href = '/result.html?id=' + conversationId; }

  async function start() {
    const pending = aiMsgPending();
    try {
      const data = await post('/api/conversations');
      conversationId = data.id;
      outline = data.outline;
      position = data.position;
      const started = new Date(data.started_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      document.getElementById('sessionInfo').textContent = `Session started ${started}`;
      document.getElementById('asideTitle').textContent =
        ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six'][outline.length] + (outline.length === 1 ? ' dimension' : ' dimensions');
      renderDims();
      pending.fill(data.intro);
      addDividerIfNewDimension();
      aiMsgPending().fill(data.question);
      setWaiting(false);
    } catch (error) {
      pending.element.remove();
      statusLine.textContent = 'The conversation could not be started. Please reload the page.';
    }
  }

  async function answer(text) {
    text = text.trim();
    if (!text || !conversationId) return;
    // The check box (test mode only) belongs to the last chatbot message; once answered it is removed.
    document.querySelectorAll('.check-box').forEach(box => box.remove());
    userMsg(text);
    ta.value = '';
    statusLine.textContent = '';
    setWaiting(true);
    const pending = aiMsgPending();
    try {
      const data = await post(`/api/conversations/${conversationId}/answer`, { text });
      const movedOn = data.position !== position;
      position = data.position;
      renderDims();
      if (data.done) {
        pending.fill(data.message);
        finish();
        return;
      }
      if (movedOn) {
        // A new subdimension: its opening question may start a new dimension.
        pending.element.remove();
        addDividerIfNewDimension();
        aiMsgPending().fill(data.message);
      } else {
        pending.fill(data.message);
        if (data.check) addCheck(pending.element, data.check);
      }
      setWaiting(false);
    } catch (error) {
      // Put the answer back so it is not lost, and let the respondent try again.
      pending.element.remove();
      thread.lastElementChild.remove();
      ta.value = text;
      setWaiting(false);
      statusLine.textContent = 'Your answer could not be sent. Please try again.';
    }
  }

  reportButton.addEventListener('click', openReport);
  document.getElementById('composer').addEventListener('submit', e => { e.preventDefault(); answer(ta.value); });
  // Enter sends, Shift+Enter starts a new line.
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });

  start();
</script>
</body>
</html>
