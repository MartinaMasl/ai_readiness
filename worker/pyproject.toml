[project]
name = "ai-readiness-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk", "pytest"]

[tool.pytest.ini_options]
# The Worker imports its modules from src/ (e.g. "import scoring"); tests do the same.
pythonpath = ["src"]
testpaths = ["tests"]
